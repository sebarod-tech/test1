name: Chequear WhatsApp

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        
      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Ejecutar chequeo gratuito
        run: node scripts/check-status.js

      - name: Guardar JSON actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json data/incidents.json
          git diff --cached --quiet || git commit -m "Actualizar estado de WhatsApp"
          git push
